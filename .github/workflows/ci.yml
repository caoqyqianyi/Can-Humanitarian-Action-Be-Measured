name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        run: pytest
      - name: Validate registry
        run: aadesk validate
      - name: Audit the example framework
        run: |
          aadesk audit data/examples/logframe_example.csv --outdir build
          test -f build/brief.html
      - name: Upload brief
        uses: actions/upload-artifact@v4
        with:
          name: brief-${{ matrix.python-version }}
          path: build/
