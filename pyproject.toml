[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aadesk"
version = "0.1.0"
description = "Turn hazard and population evidence into monitorable, disclosure-safe humanitarian indicators."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Qianyi Cao" }]
keywords = ["humanitarian", "anticipatory-action", "indicators", "isimip", "iiasa", "data-quality"]
dependencies = [
  "pandas>=2.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
aadesk = "aadesk.cli:main"

[project.urls]
Homepage = "https://github.com/caoqyqianyi/aa-data-desk"

[tool.hatch.build.targets.wheel]
packages = ["src/aadesk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
